name: Deploy

# Production deployment runs here, not through Vercel's own git integration,
# which is disabled in apps/web/vercel.json. The build is produced by the
# Vercel CLI inside this job and uploaded prebuilt, so what ships is exactly
# what this workflow verified.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # The smoke test parses stdout; keep the CLI's telemetry notice out of it.
  VERCEL_TELEMETRY_DISABLED: 1

jobs:
  # This workflow is copied wherever the repository is, including into
  # organisations that hold none of the Vercel secrets. Without them the deploy
  # job cannot do anything useful, and a failing deploy on a copy that was
  # never meant to deploy reads as a broken build. Secrets cannot be tested
  # in a job-level `if:` directly, so this job reads one and publishes the
  # answer as an output for the deploy job to gate on. The verify job runs
  # regardless: the tests and the model gate are worth running on any copy.
  preflight:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials present; deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_TOKEN secret on this repository; deploy will be skipped."
          fi

  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:packages
      - run: npm run gate

  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight, verify]
    if: needs.preflight.outputs.configured == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        # Pinned, not @latest: this workflow is the production gate, and a CLI
        # release should not be able to change it without a commit here.
        run: npm install --global vercel@59.16.0
      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Deploy prebuilt output
        id: deploy
        # The CLI prints a JSON object here, not a bare URL, and a multi-line
        # value cannot be written to $GITHUB_OUTPUT with a plain echo -- the
        # output silently ends up empty and every later step addresses
        # nothing. Pull the first deployment host out of whatever was printed,
        # which holds for both the JSON and the older bare-URL output, and
        # fail the step if nothing matched rather than deploying blind.
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee deploy.out
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.out | head -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
      - name: Smoke test
        # `vercel deploy` prints the unique deployment URL, and deployment
        # protection gates that URL even for a production deployment: the
        # production domain is public, the generated one is not. `vercel curl`
        # carries the token through, so this reads the health route rather
        # than a login page.
        #
        # The URL goes in as the positional argument, with the path appended.
        # Passing a full URL to --deployment alongside a path builds a
        # malformed URL and curl rejects it before any request is made.
        #
        # Authentication comes from VERCEL_TOKEN in the environment, not from
        # --token. This subcommand forwards every flag it does not recognise
        # to the curl binary, and --token is one it does not recognise, so
        # curl rejected it as an unknown option and the request never ran.
        # Every other step accepts --token, which is why only this one broke.
        #
        # Flags after -- go to curl itself: --fail turns an HTTP error into a
        # non-zero exit, and --silent keeps the progress meter out of the
        # body. Anything that is not the expected JSON -- an error body, an
        # HTML interstitial -- fails the parse and the job.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl "${{ steps.deploy.outputs.url }}/api/v1/health" --yes -- --fail --silent --show-error | tee health.json
          node -e "const h=require('./health.json'); if(!h.ok) process.exit(1)"
